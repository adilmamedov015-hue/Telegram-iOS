name: Build Telegram IPA (modified)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Prepare build environment (use template + fix xcode version)
        run: |
          mkdir -p build-input/fake-codesigning
          cp build-system/template_minimal_development_configuration.json build-input/config.json
          # Заменяем неверную версию Xcode на 16.2 (если там 26.2)
          sed -i '' 's/"xcode_version": *"[^"]*"/"xcode_version": "16.2"/' build-input/config.json

      - name: Build IPA for device
        run: |
          python3 build-system/Make/Make.py build \
            --buildNumber=1 \
            --configurationPath=build-input/config.json \
            --codesigningInformationPath=build-input/fake-codesigning \
            --configuration=debug_arm64

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa-modified
          path: build-output/Telegram.ipa
