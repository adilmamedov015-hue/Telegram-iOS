name: Build Telegram IPA (modified)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Find all occurrences of Xcode 26.2
        run: |
          echo "=== Поиск строки '26.2' во всех файлах ==="
          grep -r -n "26\.2" . || echo "Ничего не найдено"
          echo "=== Проверка ключевых файлов ==="
          echo "--- versions.json ---"
          cat versions.json 2>/dev/null || echo "versions.json не найден"
          echo "--- build-system/versions.json ---"
          cat build-system/versions.json 2>/dev/null || echo "build-system/versions.json не найден"
          echo "--- .bazelrc ---"
          cat .bazelrc 2>/dev/null || echo ".bazelrc не найден"
          echo "--- WORKSPACE ---"
          cat WORKSPACE 2>/dev/null || echo "WORKSPACE не найден"
          echo "--- build-system/bazel-ios-common/bazel_ios_common.bzl (или похожий) ---"
          find . -name "*.bzl" -exec grep -l "26\.2" {} \; -exec cat {} \; || echo "В .bzl не найдено"

      - name: Prepare build environment (with template)
        run: |
          mkdir -p build-input/fake-codesigning
          cp build-system/template_minimal_development_configuration.json build-input/config.json
          sed -i '' 's/"xcode_version": *"[^"]*"/"xcode_version": "16.2"/' build-input/config.json

      - name: Build IPA for device
        run: |
          python3 build-system/Make/Make.py build \
            --buildNumber=1 \
            --configurationPath=build-input/config.json \
            --codesigningInformationPath=build-input/fake-codesigning \
            --configuration=debug_arm64

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa-modified
          path: build-output/Telegram.ipa
