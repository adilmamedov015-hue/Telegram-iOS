name: Build Telegram IPA (modified)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Prepare custom configuration
        run: |
          mkdir -p build-input/fake-codesigning
          cat > build-input/config.json <<EOF
          {
            "xcode_version": "16.2",
            "ios_sdk_version": "18.0",
            "macos_sdk_version": "15.0",
            "tvos_sdk_version": "18.0",
            "visionos_sdk_version": "2.0",
            "minimum_ios_version": "13.0"
          }
          EOF

      # Ищем, откуда берётся 26.2
      - name: Find Xcode 26.2 requirement
        run: |
          echo "=== Поиск в .json, .bzl, .bazel, .py ==="
          grep -r "26\.2" --include="*.json" --include="*.bzl" --include="*.bazel" --include="*.py" . || echo "Не найдено в текстовых файлах"
          echo "=== Содержимое versions.json (если есть) ==="
          cat versions.json 2>/dev/null || echo "versions.json не найден"
          echo "=== Содержимое build-system/versions.json (если есть) ==="
          cat build-system/versions.json 2>/dev/null || echo "build-system/versions.json не найден"

      - name: Build IPA for device
        run: |
          python3 build-system/Make/Make.py build \
            --buildNumber=1 \
            --configurationPath=build-input/config.json \
            --codesigningInformationPath=build-input/fake-codesigning \
            --configuration=debug_arm64

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa-modified
          path: build-output/Telegram.ipa
